# SPDX-License-Identifier: Apache-2.0
# The fork's tests on GitHub (jeonghwanko/sprite-gen-agent, 2026-10-29). Upstream runs its gates on the maintainer's own
# Linux runner (scripts/linux_lane.sh) and removed its workflows (3828e34); this fork's pull requests had no test run at all
# and merged on a Windows checkout's results, where symlink and cp949 failures hide real ones. This job is the lane's suite
# on a GitHub runner: Python 3.14, ffmpeg, img2webp from libwebp 1.6.0 (SHA-256 pinned, the creator kit's pin), Node.js,
# `pip install -e ".[dev]"`, then the fast bundle (`pytest`, the slow tests deselected by tests/conftest.py). No RIFE is
# installed: the tests marked real_rife and torch_rife skip, as the lane's `--rife-unmeasured` run lets them.
name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LIBWEBP: libwebp-1.6.0-linux-x86-64
      LIBWEBP_SHA256: 1c5ffab71efecefa0e3c23516c3a3a1dccb45cc310ae1095c6f14ae268e38067
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: img2webp (libwebp 1.6.0, -exact)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$LIBWEBP.tar.gz" "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/$LIBWEBP.tar.gz"
          echo "$LIBWEBP_SHA256  $RUNNER_TEMP/$LIBWEBP.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$LIBWEBP.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$LIBWEBP/bin" >> "$GITHUB_PATH"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          img2webp -h 2>&1 | grep -q -- -exact
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider
