# SPDX-License-Identifier: Apache-2.0
# The fork's tests on GitHub (jeonghwanko/sprite-gen-agent, 2026-10-29). Upstream runs its gates on the maintainer's own
# Linux runner (scripts/linux_lane.sh) and removed its workflows (3828e34); this fork's pull requests had no test run at all
# and merged on a Windows checkout's results, where symlink and cp949 failures hide real ones. This job is the lane's suite
# on a GitHub runner: Python 3.14, ffmpeg, img2webp from libwebp 1.6.0 (SHA-256 pinned, the creator kit's pin), Node.js,
# `pip install -e ".[dev]"`, then the fast bundle (`pytest`, the slow tests deselected by tests/conftest.py). No RIFE is
# installed: the tests marked real_rife and torch_rife skip, as the lane's `--rife-unmeasured` run lets them.
#
# What it costs (2026-11-07, the last 100 runs): the test job was pytest alone for ~18 minutes, and 43 of the runs were a
# push to main that ran again on the merge commit the pull request's run had just passed (its merge ref). So a push to main
# runs nothing, and a run by hand (workflow_dispatch) checks main; a draft pull request runs nothing until it is ready; the
# tests wait for lint and run on every core of the runner (pytest-xdist, `-n auto`).
name: test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ruff and mypy, configured in pyproject.toml. Seconds, not the test job's minutes, so a lint failure shows first.
  lint:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint]"
      - name: ruff
        run: python -m ruff check --output-format github .
      - name: mypy
        run: python -m mypy

  # After lint, so a lint failure ends the run in under a minute instead of beside a full test run.
  test:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBWEBP: libwebp-1.6.0-linux-x86-64
      LIBWEBP_SHA256: 1c5ffab71efecefa0e3c23516c3a3a1dccb45cc310ae1095c6f14ae268e38067
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # apt takes 17 to 64 s here (twelve runs, 2026-11). Once (run 42276947741, 2026-11-06) it hung, and the job sat until
      # its 40-minute limit; the step's own limit ends such a run in minutes.
      - name: ffmpeg
        timeout-minutes: 5
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: img2webp (libwebp 1.6.0, -exact)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$LIBWEBP.tar.gz" "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/$LIBWEBP.tar.gz"
          echo "$LIBWEBP_SHA256  $RUNNER_TEMP/$LIBWEBP.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$LIBWEBP.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$LIBWEBP/bin" >> "$GITHUB_PATH"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          img2webp -h 2>&1 | grep -q -- -exact
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider -n auto
